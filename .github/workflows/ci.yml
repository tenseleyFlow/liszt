name: ci

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
    branches: [trunk]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install GNU coreutils oracle (macOS)
        if: runner.os == 'macOS'
        run: brew install coreutils
      - name: generate LC_TIME matrix locales (Linux)
        if: runner.os == 'Linux'
        run: sudo locale-gen de_DE.UTF-8 ja_JP.UTF-8
      # Linux builds the exact pinned oracle from source (cached); macOS
      # uses brew's gls as a loose oracle - coreutils 9.11 does not build
      # cleanly against current macOS SDKs, so pin-sensitive cases skip
      # there (nomad-1 carries the pinned run at release time).
      - name: cache pinned oracle
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: build/gnu-ls
          key: gnu-ls-9.11-${{ runner.os }}-v1
      - name: build pinned oracle (coreutils 9.11)
        if: runner.os == 'Linux'
        run: sh scripts/build-gnu-ls.sh
      - run: ./configure
      - run: make
      - run: make check
      - run: make sanitize

  alpine:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4
      # build-base gives gcc/make against musl; coreutils provides the GNU
      # oracle (busybox ls is never an oracle). No sanitize: musl has no ASan.
      - run: apk add build-base bash grep sed coreutils
      - run: ./configure
      - run: make
      - run: make check

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y gmake coreutils
          run: |
            ./configure
            gmake
            gmake check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, alpine, freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: distcheck and tarball
        run: |
          ./configure
          make distcheck
          sha256sum liszt-*.tar.gz > SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: an API-outage rerun uploads into the release a
          # manual recovery already created (v0.3.0 lesson).
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber \
              liszt-*.tar.gz SHA256SUMS
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "liszt ${GITHUB_REF_NAME}" \
            --notes "Byte-identical to GNU ls 9.11 under a pinned environment with no extension flag active; faster on every measured workload on both release machines. Extensions, all off by default: Nerd-Font icons (--icons), tree mode (--tree), dependency-free git status (--git), eza-grade metadata coloring (--color=full), and 23 built-in 24-bit themes (--theme, LISZT_THEME, LISZT_COLORS) - measured 4-16x faster than the eza equivalents (bench/release/ in the tree). Full golden, fuzz, and sanitizer gates green on Linux (glibc, musl), macOS, and FreeBSD." \
            liszt-*.tar.gz SHA256SUMS
